name: Recover verified source
on:
  push:
    branches: [feat/recover-client-source]
    paths: ['.recovery/**', '.github/workflows/recover-source.yml']
permissions:
  contents: write
concurrency:
  group: source-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify and recover bounded source archive
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, tarfile
          root = pathlib.Path.cwd()
          manifest = json.loads((root / '.recovery/manifest.json').read_text())
          assert manifest['parts'] == 7 and manifest['files'] == 83
          archive = b''.join((root / f'.recovery/part-{i:02d}').read_bytes() for i in range(7))
          assert len(archive) == manifest['bytes'] == 91632
          assert hashlib.sha256(archive).hexdigest() == manifest['sha256'] == '41b1d8523dea1dd7d2995c17abd08b272f91a5a4a83d490468c6ccb38e486532'
          files = {}
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:xz') as tar:
              for member in tar:
                  path = pathlib.PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute()
                  assert not any(p in ('..', '.git', '.github', '.recovery') for p in path.parts)
                  assert member.name not in files and 0 <= member.size <= 100000
                  data = tar.extractfile(member).read(100001)
                  assert len(data) == member.size
                  files[member.name] = data
          assert len(files) == 83 and sum(map(len, files.values())) < 1000000
          for name, data in files.items():
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          print('Verified and recovered', len(files), 'source files')
          PY
      - run: npm run check
      - run: npm test
      - name: Commit recovered sources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .recovery
          git add apps packages tests tools docs package.json README.md LICENSE .gitignore targets.example.json
          git commit -m 'feat: recover independently implemented RDP browser client and 81 tests'
          git push origin HEAD:feat/recover-client-source
