name: Browser gateway integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          python3 -m venv /tmp/rdp-browser
          /tmp/rdp-browser/bin/pip install playwright==1.63.0
          /tmp/rdp-browser/bin/python -m playwright install --with-deps chromium
      - name: Exercise subpath build and separate local gateway in Chromium
        run: /tmp/rdp-browser/bin/python tools/browser-gateway-tests.py
      - name: Compare maximum cursor rendering pixel for pixel in Chromium
        run: /tmp/rdp-browser/bin/python tools/browser-pointer-tests.py
      - name: Exercise OS clipboard, browser controls, worker transfers and CLIPRDR over TLS/NLA
        run: /tmp/rdp-browser/bin/python tools/browser-clipboard-tests.py
      - name: Exercise opt-in PCM playback, mute, worker transfers and RDPSND through TLS/NLA
        run: /tmp/rdp-browser/bin/python tools/browser-audio-tests.py
      - name: Exercise lost gateway probes and explicit fresh-credential reconnection
        run: /tmp/rdp-browser/bin/python tools/browser-recovery-tests.py
      - name: Exercise authenticated CAL issuance, cache reuse and persistence-gated activation
        run: /tmp/rdp-browser/bin/python tools/browser-licensing-tests.py
      - name: Exercise explicit-consent microphone, worklet credits and AUDIN through TLS/NLA
        run: /tmp/rdp-browser/bin/python tools/browser-microphone-tests.py
      - name: Compare NSCodec pixels and exercise atomic surface frames through TLS/NLA
        run: /tmp/rdp-browser/bin/python tools/browser-surface-tests.py
      - name: Compare negotiated GDI blits and caches against pixel oracle over TLS/NLA
        run: /tmp/rdp-browser/bin/python tools/browser-gdi-tests.py
